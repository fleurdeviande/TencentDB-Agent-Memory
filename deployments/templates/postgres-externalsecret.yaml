{{- if .Values.postgres.enabled }}
# Same store and API version as shared-chart-app's envOpenbaoSecrets, but a Secret of our own:
# the StatefulSet must not depend on a subchart alias being enabled.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agent-memory.postgres.name" . }}
  labels:
    {{- include "agent-memory.postgres.labels" . | nindent 4 }}
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.postgres.password.secretStore }}
  target:
    name: {{ include "agent-memory.postgres.name" . }}
  data:
    - secretKey: postgres_password
      remoteRef:
        key: {{ .Values.postgres.password.openbaoSecretPath }}
        property: {{ .Values.postgres.password.openbaoSecretKey }}
{{- end }}
