{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agent-memory.postgres.name" . }}
  labels:
    {{- include "agent-memory.postgres.labels" . | nindent 4 }}
spec:
  # Single primary, no replication: more replicas would be independent empty databases.
  replicas: 1
  serviceName: {{ include "agent-memory.postgres.name" . }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "agent-memory.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-memory.postgres.selectorLabels" . | nindent 8 }}
        {{- include "agent-memory.postgres.labels" . | nindent 8 }}
      annotations:
        checksum/init: {{ include (print $.Template.BasePath "/postgres-configmap.yaml") . | sha256sum }}
    spec:
      {{- with $pg.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # uid/gid 999 = postgres in the official image; fsGroup makes the fresh RBD volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: {{ $pg.terminationGracePeriodSeconds }}
      containers:
        - name: postgres
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- with $pg.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.user | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-memory.postgres.name" . }}
                  key: postgres_password
            # Subdirectory: the volume root holds lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: init
          configMap:
            name: {{ include "agent-memory.postgres.name" . }}-init
        - name: run
          emptyDir: {}
        # Docker's 64Mi default /dev/shm is too small for parallel queries / HNSW builds.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $pg.shmSize }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "agent-memory.postgres.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $pg.storage.storageClass | quote }}
        resources:
          requests:
            storage: {{ $pg.storage.size | quote }}
{{- end }}
